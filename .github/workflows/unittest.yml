name: Build

on:
  push:
    branches:
      - main
      - release-*
    tags:
      - "v*"
  pull_request:

env:
  GO_CACHE_BUSTER: 5
  ITEST_IMAGE_TAG: rc-${{ github.event.number }}
  COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
  RUN_ID: ${{ github.run_id }}
  # A unique number for each run of a particular workflow in a repository.
  # This number begins at 1 for the workflow's first run, and increments with each new run.
  # This number does not change if you re-run the workflow run.
  RUN_NUMBER: ${{ github.run_number }}
  PULL_NUMBER: ${{ github.event.pull_request.number }}
  MIN_TESTCOV: 90

jobs:
  detect-noop:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.noop.outputs.should_skip }}
      reason: ${{ steps.noop.outputs.reason }}
      skipped_by: ${{ steps.noop.outputs.skipped_by }}
      paths_result: ${{ steps.noop.outputs.paths_result }}
    steps:
      - name: Detect No-op Changes
        # https://github.com/fkirc/skip-duplicate-actions
        id: noop
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.png", "**.jpg", "**/Documentation/**"]'
          do_not_skip: '["push","schedule","release"]'
          concurrent_skipping: false
          paths_filter: |
            go:
              paths:
                - '**/*.go'
            version:
              paths:
                - '.VERSION'

  # A pull request whose changes all match paths_ignore above (documentation
  # only) or that duplicates an already successful run skips the job, so the
  # "code cov" status is reported by code-cov-skipped instead. Pushes,
  # schedules and releases never skip (do_not_skip) (XPKI-094).
  UnitTest:
    needs:
      - detect-noop
    if: needs.detect-noop.outputs.should_skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Create code coverage status for the current commit
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          curl "https://${GIT_USER}:${GIT_TOKEN}@api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" -d "{\"state\": \"pending\",\"target_url\": \"https://github.com/${GITHUB_REPOSITORY}/pull/${PULL_NUMBER}/checks?check_run_id=${RUN_ID}\",\"description\": \"in progress — This check has started... \",\"context\": \"code cov\"}"
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER: ${{ github.actor }}

      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go tools
        shell: bash
        run: |
          make tools

      # gofmt check, go vet, govulncheck and golangci-lint; none of them
      # modifies the checkout (XPKI-095).
      - name: Lint
        run: make lint

      - name: Install softhsm2
        run: sudo apt-get install softhsm2

      - name: Prepare
        run: make vars generate hsmconfig start-local-kms

      - name: UnitTest
        env:
          AWS_ACCESS_KEY_ID: notusedbyemulator
          AWS_SECRET_ACCESS_KEY: notusedbyemulator
          AWS_DEFAULT_REGION: us-west-2
        run: |
          make covtest

      - name: Checkout unchanged by the build
        run: git diff --exit-code

      - name: Generate coverage Status
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          set -x
          PROJECT_NAME=${PROJECT_NAME}

          total=`go tool cover -func=coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+'`
          echo "total cov: $total"
          (( $(echo "$total > ${MIN_TESTCOV}" | bc -l) )) && STATE=success || STATE=failure
          curl "https://${GIT_USER}:${GIT_TOKEN}@api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" -d "{\"state\": \"${STATE}\",\"target_url\": \"https://github.com/${GITHUB_REPOSITORY}/pull/${PULL_NUMBER}/checks?check_run_id=${RUN_ID}\",\"description\": \"${total}%\",\"context\": \"code cov\"}"
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER: ${{ github.actor }}

      - name: Detect Version Changes
        # https://github.com/fkirc/skip-duplicate-actions
        id: version-changed
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths: '[".VERSION"]'
          skip_after_successful_duplicate: false

      - name: set-tag
        run: |
          VERSION=$(cat .VERSION).$(git rev-list --count HEAD)
          echo "VERSION: ${VERSION}"
          echo "DIST_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "git tag ${VERSION}"
          echo "should_skip: ${{steps.version-changed.outputs.should_skip}}"

      - name: Create Tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.version-changed.outputs.should_skip != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const {DIST_VERSION} = process.env          
            github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${DIST_VERSION}`,
                sha: context.sha
            })

  # When UnitTest is skipped for a pull request, report the "code cov" status
  # anyway so a required status check does not stay pending (XPKI-094).
  code-cov-skipped:
    needs:
      - detect-noop
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && needs.detect-noop.outputs.should_skip == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report skipped code coverage status
        # reason is paths_ignore (documentation-only change) or
        # skip_after_successful_duplicate (an identical tree already passed;
        # skipped_by names that run); the status says which.
        run: |
          case "${SKIP_REASON}" in
            paths_ignore) DESCRIPTION="skipped: documentation-only change" ;;
            skip_after_successful_duplicate) DESCRIPTION="skipped: duplicate of successful run $(echo "${SKIPPED_BY}" | jq -r '.id // .html_url // "unknown"')" ;;
            *) DESCRIPTION="skipped: ${SKIP_REASON:-unknown reason}" ;;
          esac
          echo "code cov: ${DESCRIPTION}"
          # --fail-with-body: an HTTP error must fail this job, since its only
          # purpose is to create the status
          curl --silent --show-error --fail-with-body "https://${GIT_USER}:${GIT_TOKEN}@api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" -d "{\"state\": \"success\",\"target_url\": \"https://github.com/${GITHUB_REPOSITORY}/pull/${PULL_NUMBER}/checks?check_run_id=${RUN_ID}\",\"description\": \"${DESCRIPTION}\",\"context\": \"code cov\"}"
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER: ${{ github.actor }}
          SKIP_REASON: ${{ needs.detect-noop.outputs.reason }}
          SKIPPED_BY: ${{ needs.detect-noop.outputs.skipped_by }}
